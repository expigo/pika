version: 2
updates:
  # Keep GitHub Actions current — and, once you've SHA-pinned them (e.g. `npx pinact run`),
  # Dependabot bumps the pinned SHA + version comment when a new release ships. One grouped PR/week.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # Keep pinned Docker image tags current (e.g. beszel:0.18.7) via weekly PRs.
  # Note: Dependabot can only bump *specific* version tags, not floating ones
  # (`:2`, `:latest`) — pin those to exact versions to get update PRs.
  - package-ecosystem: "docker"
    directory: "/docker/monitoring"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
