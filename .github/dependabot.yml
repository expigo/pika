version: 2
updates:
  # Keep GitHub Actions current — and, once you've SHA-pinned them (e.g. `npx pinact run`),
  # Dependabot bumps the pinned SHA + version comment when a new release ships. One grouped PR/week.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # Keep the monitoring compose's pinned image tags current (e.g. beszel:0.18.7) via weekly PRs.
  # Uses "docker-compose" (GA Feb 2025) — it scans compose.yaml; the "docker" ecosystem only
  # scans Dockerfiles (that mismatch caused the earlier "No Dockerfiles found" error).
  # Dependabot bumps *specific* tags, not floating ones (`:2`, `:latest`) — pin those for PRs.
  - package-ecosystem: "docker-compose"
    directory: "/docker/monitoring"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
