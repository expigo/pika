name: CI

# Quality gate on both deploy branches (and PRs into them), so lint/type/test
# failures surface on staging BEFORE they're promoted to main — not after.
on:
  pull_request:
    branches: [ "main", "staging" ]
  push:
    branches: [ "main", "staging" ]

# Don't pile up redundant runs on rapid pushes to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Types & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Lint (Biome — fast; covers all four packages incl. desktop; desktop a11y deferred via its nested biome.json)
      - name: Lint (Biome)
        run: bun run lint

      # Type check every package (desktop + shared were previously unchecked in CI)
      - name: Type Check (cloud / shared / desktop)
        run: |
          bun run --filter @pika/cloud typecheck
          bun run --filter @pika/shared typecheck
          bun run --filter @pika/desktop typecheck

      - name: Type Check & Build Web
        run: |
          bun run --filter @pika/web typecheck
          bun run --filter @pika/web build

      # Unit tests (mocked — no external services needed)
      - name: Unit Tests (cloud / shared / desktop / web)
        run: |
          bun run --filter @pika/cloud test
          bun run --filter @pika/shared test
          bun run --filter @pika/desktop test
          bun run --filter @pika/web test

  integration:
    name: DB Integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pika
          POSTGRES_PASSWORD: pika
          POSTGRES_DB: pika_cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pika -d pika_cloud"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://pika:pika@localhost:5432/pika_cloud
      # Slice B: the magic-link/OTP integration tests build verify URLs from the Better Auth
      # baseURL — an empty BETTER_AUTH_URL makes the plugin throw `TypeError: "" cannot be
      # parsed as a URL`. Locally .env provides these; CI must too. Test-only values.
      BETTER_AUTH_URL: http://127.0.0.1:3001
      BETTER_AUTH_SECRET: ci-integration-test-secret-not-a-real-deployment
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Apply the migration baseline, then run the gated integration suite against
      # real Postgres — this is what would have caught the missing like-constraint
      # and the migration drift the audit found.
      - name: Migrate
        run: bun run --filter @pika/cloud db:migrate

      - name: Cloud DB integration tests
        run: bun run --filter @pika/cloud test:integration

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pika
          POSTGRES_PASSWORD: pika
          POSTGRES_DB: pika_cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pika -d pika_cloud"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Both the E2E cloud (via playwright.config webServer) and the W1 spec's DB assertions read this.
      DATABASE_URL: postgres://pika:pika@localhost:5432/pika_cloud
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Schema for the E2E cloud (runs with E2E_PERSIST=1 → real `likes`/`played_tracks` rows).
      - name: Migrate
        run: bun run --filter @pika/cloud db:migrate

      # Browsers for both Playwright projects (webkit powers the iPhone `mobile-wedge` project).
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      # Playwright's webServer block spawns cloud (E2E_PERSIST=1) + web; DATABASE_URL flows through
      # the config. reuseExistingServer is off under CI, so servers are always spawned fresh.
      - name: E2E tests (Playwright)
        run: bun run test:e2e
