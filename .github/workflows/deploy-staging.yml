name: Deploy to Staging

on:
  push:
    branches:
      - staging
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

# Never interrupt an in-flight deploy; queue the next one instead.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push images to GHCR

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build the images on a fast GitHub runner (4 vCPU / 16 GB) and push to
  #    GHCR. This replaces the ~18-minute, OOM-prone build on the 1-vCPU VPS.
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push cloud image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/cloud/Dockerfile
          push: true
          tags: |
            ghcr.io/expigo/pika-cloud:staging
            ghcr.io/expigo/pika-cloud:${{ github.sha }}
          cache-from: type=gha,scope=cloud
          cache-to: type=gha,mode=max,scope=cloud

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/web/Dockerfile
          push: true
          tags: |
            ghcr.io/expigo/pika-web:staging
            ghcr.io/expigo/pika-web:${{ github.sha }}
          # NEXT_PUBLIC_* are baked into the client bundle at build time, so the
          # web image is environment-specific. URLs are public; secrets are
          # optional (build still succeeds if unset — Sentry upload is skipped).
          build-args: |
            NEXT_PUBLIC_CLOUD_WS_URL=wss://staging-api.pika.stream/ws
            NEXT_PUBLIC_CLOUD_API_URL=https://staging-api.pika.stream
            NEXT_PUBLIC_ENV=staging
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ---------------------------------------------------------------------------
  # 2. Deploy: the VPS just pulls the prebuilt images and recreates the changed
  #    services. No build on the box. GHCR auth uses the job-scoped GITHUB_TOKEN
  #    (valid for this run), so no manual `docker login` / PAT is required.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS (Staging)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_key }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 10m
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            echo "🚀 Starting Staging Deployment (pull prebuilt images)..."

            mkdir -p /opt/pika/pika-staging
            cd /opt/pika/pika-staging
            if [ ! -d ".git" ]; then
              echo "Cloning repository for the first time..."
              git clone -b staging git@github.com:expigo/pika.git . || git clone -b staging https://github.com/expigo/pika.git .
            fi

            # 1. Get latest compose/config
            git fetch origin staging
            git reset --hard origin/staging

            # 2. Authenticate to GHCR and pull the freshly-built images
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.staging.yml -p pika-staging pull

            # 3. Recreate only services whose image changed (db is left running)
            docker compose -f docker-compose.staging.yml -p pika-staging up -d

            # 4. Verify services became healthy — fail the deploy (red) if not.
            echo "🩺 Waiting for containers to report healthy..."
            HEALTHY=0
            for i in $(seq 1 30); do
              CLOUD=$(docker inspect --format '{{.State.Health.Status}}' pika-staging-cloud 2>/dev/null || echo missing)
              WEB=$(docker inspect --format '{{.State.Health.Status}}' pika-staging-web 2>/dev/null || echo missing)
              echo "  attempt $i/30 — cloud=$CLOUD web=$WEB"
              if [ "$CLOUD" = "healthy" ] && [ "$WEB" = "healthy" ]; then HEALTHY=1; break; fi
              sleep 4
            done
            if [ "$HEALTHY" -ne 1 ]; then
              echo "❌ Services did not become healthy in time. Diagnostics:"
              docker compose -f docker-compose.staging.yml -p pika-staging ps || true
              docker compose -f docker-compose.staging.yml -p pika-staging logs --tail=60 web cloud || true
              docker logout ghcr.io || true
              exit 1
            fi

            # 5. Cleanup
            docker logout ghcr.io || true
            docker image prune -f
            echo "✅ Staging Deployment Complete!"
