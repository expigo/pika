name: Deploy to Staging

on:
  push:
    branches:
      - staging
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  deploy:
    name: Deploy to VPS (Staging)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_key }}
          port: ${{ secrets.VPS_PORT }}
          # Web build (next build, 1-CPU capped) takes ~18min on the VPS; 20m was too tight.
          # NOTE: the durable fix is to build images in CI and pull on the VPS (see deploy notes).
          command_timeout: 40m
          script: |
            set -e
            echo "🚀 Starting Staging Deployment..."
            
            # Ensure the directory exists (create if first run)
            mkdir -p /opt/pika/pika-staging
            
            # Navigate to staging directory
            cd /opt/pika/pika-staging
            
            # Check if it's currently a git repo; if not, clone it
            if [ ! -d ".git" ]; then
              echo "Cloning repository for the first time..."
              # Clone only the staging branch
              git clone -b staging git@github.com:expigo/pika.git . || git clone -b staging https://github.com/expigo/pika.git .
            fi
            
            # 1. Get latest code
            git fetch origin staging
            git reset --hard origin/staging
            
            # 2. Rebuild and Restart Staging Services
            # We use project-name 'pika-staging' to avoid conflict with prod default project
            docker compose -f docker-compose.staging.yml -p pika-staging down
            docker compose -f docker-compose.staging.yml -p pika-staging up -d --build --force-recreate

            # 3. Verify services became healthy — fail the deploy (red) if not.
            # Reuses the in-container healthchecks defined in docker-compose.staging.yml,
            # so a crash-looping container can no longer pass as a "successful" deploy.
            echo "🩺 Waiting for containers to report healthy..."
            HEALTHY=0
            for i in $(seq 1 30); do
              CLOUD=$(docker inspect --format '{{.State.Health.Status}}' pika-staging-cloud 2>/dev/null || echo missing)
              WEB=$(docker inspect --format '{{.State.Health.Status}}' pika-staging-web 2>/dev/null || echo missing)
              echo "  attempt $i/30 — cloud=$CLOUD web=$WEB"
              if [ "$CLOUD" = "healthy" ] && [ "$WEB" = "healthy" ]; then HEALTHY=1; break; fi
              sleep 4
            done
            if [ "$HEALTHY" -ne 1 ]; then
              echo "❌ Services did not become healthy in time. Diagnostics:"
              docker compose -f docker-compose.staging.yml -p pika-staging ps || true
              docker compose -f docker-compose.staging.yml -p pika-staging logs --tail=60 web cloud || true
              exit 1
            fi
            echo "✅ Staging services healthy"

            # 4. Prune old images
            docker image prune -f

            echo "✅ Staging Deployment Complete!"
