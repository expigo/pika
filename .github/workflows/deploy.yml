name: Deploy to Production

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          # We use a key instead of password for security
          key: ${{ secrets.VPS_key }} 
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script: |
            set -e
            echo "🚀 Starting Deployment..."
            cd /opt/pika/pika
            
            # 1. Get latest code
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Rebuild and Restart Cloud & Web
            # We don't restart DB (pika-db) to avoid downtime, unless manual intervention needed
            docker compose -f docker-compose.prod.yml up -d --build --force-recreate cloud web

            # 3. Verify services became healthy — fail the deploy (red) if not.
            # Reuses the in-container healthchecks defined in docker-compose.prod.yml.
            echo "🩺 Waiting for containers to report healthy..."
            HEALTHY=0
            for i in $(seq 1 30); do
              CLOUD=$(docker inspect --format '{{.State.Health.Status}}' pika-cloud 2>/dev/null || echo missing)
              WEB=$(docker inspect --format '{{.State.Health.Status}}' pika-web 2>/dev/null || echo missing)
              echo "  attempt $i/30 — cloud=$CLOUD web=$WEB"
              if [ "$CLOUD" = "healthy" ] && [ "$WEB" = "healthy" ]; then HEALTHY=1; break; fi
              sleep 4
            done
            if [ "$HEALTHY" -ne 1 ]; then
              echo "❌ Services did not become healthy in time. Diagnostics:"
              docker compose -f docker-compose.prod.yml ps || true
              docker compose -f docker-compose.prod.yml logs --tail=60 web cloud || true
              exit 1
            fi
            echo "✅ Production services healthy"

            # 4. Prune old images to save space on your 150GB disk
            docker image prune -f

            echo "✅ Deployment Complete!"
