name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-changes:
    name: Check for Functional Changes
    runs-on: ubuntu-latest
    outputs:
      desktop_changed: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Compare tag against previous commit to see what changed in this release
          base: ${{ github.event.before || github.event.base_ref || 'HEAD~1' }}
          filters: |
            desktop:
              - 'packages/desktop/**'
              - 'packages/shared/**'
              - '.github/workflows/release-desktop.yml'
              - '.github/actions/setup-sidecar/**'
              # Exclude version-bump files to prevent "ghost" releases
              - '!packages/desktop/package.json'
              - '!packages/desktop/src-tauri/tauri.conf.json'
              - '!packages/desktop/src-tauri/Cargo.toml'
              - '!packages/shared/package.json'
              - '!packages/shared/src/index.ts'

  release:
    name: Build Installer (${{ matrix.os }})
    needs: check-changes
    # Build if desktop code actually changed OR if manually triggered
    if: needs.check-changes.outputs.desktop_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos

    steps:
      - uses: actions/checkout@v7

      # 1. Setup Environment (Node/Bun/Rust)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 2. Setup Rust Cache (NEW: Dramatically speeds up builds)
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install macOS Dependencies
        if: matrix.platform == 'macos'
        run: |
          brew install create-dmg

      # 2. Setup Python & Build Sidecar
      - name: Setup & Build Sidecar
        uses: ./.github/actions/setup-sidecar

      # 4. Build Web App dependencies
      - name: Install Node Dependencies
        run: bun install

      # 5. Build Tauri App
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_ENV: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Pika! Desktop ${{ github.ref_name }}"
          releaseBody: "Functional changes detected. New build generated for ${{ github.ref_name }}."
          releaseDraft: true
          prerelease: false
          projectPath: packages/desktop
