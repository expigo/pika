services:
  db:
    image: postgres:16-alpine
    container_name: pika-db
    mem_limit: 512m # cap so no single container can exhaust the shared 4 GB host
    environment:
      POSTGRES_USER: pika
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in prod .env}
      POSTGRES_DB: pika_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # Allow SSH Tunneling
    restart: unless-stopped
    # 🏥 HEALTHCHECK: Is Postgres ready to accept connections?
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pika -d pika_prod" ]
      interval: 5s
      timeout: 5s
      retries: 5

  cloud:
    # Built & pushed by the "Deploy to Production" workflow (GHCR). The VPS only
    # pulls — it never builds (1 vCPU / 4 GB can't build Next, and it's the live host).
    image: ghcr.io/expigo/pika-cloud:prod
    container_name: pika-cloud
    mem_limit: 512m # Bun server; sits well under this in normal use
    environment:
      - DATABASE_URL=postgres://pika:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in prod .env}@db:5432/pika_prod
      - NODE_ENV=production
      - PORT=3001
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=production
    # ❌ Remove volume mounts in production for better stability/isolation
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/health').then(r => r.ok || process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Grace window so the on-boot `drizzle-kit migrate` doesn't trip a false unhealthy.
      start_period: 20s

  web:
    # Built & pushed by the "Deploy to Production" workflow (GHCR), with the
    # NEXT_PUBLIC_* baked in there. The VPS only pulls — it never builds.
    image: ghcr.io/expigo/pika-web:prod
    container_name: pika-web
    # Caps the slow RSS growth: a leak gets OOM-killed + auto-restarted (restart:
    # unless-stopped) instead of slowly starving prod off the 4 GB box.
    mem_limit: 768m
    environment:
      - NEXT_PUBLIC_CLOUD_WS_URL=wss://api.pika.stream/ws
      - NEXT_PUBLIC_CLOUD_API_URL=https://api.pika.stream
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=production
      - NEXT_PUBLIC_ENV=production
      - PORT=3000
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      cloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then(r => r.ok || process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
