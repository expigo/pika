services:
  db:
    image: postgres:16-alpine
    container_name: pika-staging-db
    mem_limit: 384m # staging is secondary — keep it from crowding prod on the 4 GB host
    environment:
      POSTGRES_USER: ${DB_USER:-pika}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-pika_staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432" # 5433 for Staging to allow separate SSH tunneling
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-pika} -d ${DB_NAME:-pika_staging}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  cloud:
    # Image is built & pushed by the "Deploy to Staging" workflow (GHCR). The
    # VPS only pulls — it never builds (1 vCPU / 4 GB can't build Next sanely).
    image: ghcr.io/expigo/pika-cloud:staging
    container_name: pika-staging-cloud
    mem_limit: 384m
    environment:
      - DATABASE_URL=postgres://${DB_USER:-pika}:${DB_PASSWORD}@db:5432/${DB_NAME:-pika_staging}
      - NODE_ENV=production
      - PORT=4001
      - WS_RATE_LIMIT=${WS_RATE_LIMIT:-1000}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=staging
      # Track D (Spotify web-DJ). Values live in the VPS .env. WEB_BASE_URL is REQUIRED here:
      # NODE_ENV=production makes webBaseUrl() default to the PROD web URL otherwise.
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-https://staging-api.pika.stream/api/spotify/callback}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - WEB_BASE_URL=${WEB_BASE_URL:-https://staging.pika.stream}
    ports:
      - "127.0.0.1:4001:4001"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4001/health').then(r => r.ok || process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Grace window so the on-boot `drizzle-kit migrate` doesn't trip a false unhealthy.
      start_period: 20s

  web:
    # Image is built & pushed by the "Deploy to Staging" workflow (GHCR), with
    # the NEXT_PUBLIC_* baked in there. The VPS only pulls — it never builds.
    image: ghcr.io/expigo/pika-web:staging
    container_name: pika-staging-web
    mem_limit: 512m
    environment:
      - NEXT_PUBLIC_CLOUD_WS_URL=wss://staging-api.pika.stream/ws
      - NEXT_PUBLIC_CLOUD_API_URL=https://staging-api.pika.stream
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=staging
      - NEXT_PUBLIC_ENV=staging
      - NODE_ENV=production
      - PORT=4000
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped
    depends_on:
      cloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4000').then(r => r.ok || process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_staging_data:
